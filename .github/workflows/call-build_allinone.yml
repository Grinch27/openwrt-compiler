name: Call Build (All in One)

# Github Actions workflow syntax reference:
# https://docs.github.com/zh/actions/reference/workflows-and-actions/workflow-syntax
# https://docs.github.com/zh/actions/reference/workflows-and-actions/metadata-syntax#runs-for-composite-actions
# https://docs.github.com/en/actions/reference/workflows-and-actions/reusing-workflow-configurations#yaml-anchors-and-aliases
# Verify both execution modes on hosted runners, including job placement and /builder.
# Confirm hosted schedule/call inputs, both build environments, and release behavior.
# Direct main pushes build Nokia EA0326GMP and may update its release.
# All targets require their local profile configuration; verify new targets before scheduling.
# Review future runner-resolution reuse separately; retain dynamic runner selection.
# Runner-only: build inputs/defaults belong to action.env; preserve typed boolean inputs.
# Risk: trusted HTTPS build sources only; shared input-custom validates overrides.
# Verify hosted input expressions, exact config SHA, clean clone paths and defconfig equivalence.
# Unknown: historical forks and indirect DIY dependencies require real build acceptance.
# Verify DIY exit status and copying optional overlays with dotfiles or empty directories.
# Variable setup: preserve exported names and paths; verify both execution modes and shared env-indocker.
# Verify build directory creation after mounting, profile path containment, and spaces in paths.
# Verify direct push, reusable caller, explicit false, invalid inputs and hosted release behavior.

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/call-build_allinone.yml"
      - "MediaTek_Ralink_ARM/MT798x/nokia_ea0326gmp/**"
  workflow_dispatch:
    inputs:
      OpenWrt_Repository:
        description: "repository (full HTTPS URL)"
        type: string
        required: false
        default: "https://git.openwrt.org/openwrt/openwrt.git"
      OpenWrt_Branch:
        description: "Git branch name"
        type: string
        required: false
        default: "main"
      Target_System:
        description: "target system"
        type: choice
        required: false
        default: "x86"
        options:
          - x86
          - MediaTek_Ralink_ARM
          - MediaTek_Ralink_MIPS
      Subtarget:
        description: "subtarget"
        type: choice
        required: false
        default: "x86_64"
        options:
          - x86_64
          - MT798x
          - MT7620
          - MT7621
      Target_Profile:
        description: "local profile (empty means Subtarget)"
        type: string
        required: false
        default: ""
      Use_Container:
        description: "run the build job in a container"
        type: boolean
        required: false
        default: true
      custom_env:
        description: "toolchain key=value;key=value (no secrets)"
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      OpenWrt_Repository:
        type: string
        required: true
      OpenWrt_Branch:
        type: string
        required: true
      Target_System:
        type: string
        required: true
      Subtarget:
        type: string
        required: true
      Target_Profile:
        type: string
        default: ""
      Use_Container:
        type: boolean
        default: true
      custom_env:
        type: string
        default: ""

run-name: >-
  Compile OpenWrt -
  ${{ github.event_name }} -
  ${{ github.ref_name }}

permissions: write-all

defaults:
  run:
    shell: bash

env:
  DEBIAN_FRONTEND: noninteractive
  DEBCONF_NONINTERACTIVE_SEEN: "true"
  APT_LISTCHANGES_FRONTEND: none
  NEEDRESTART_MODE: a
  FORCE_UNSAFE_CONFIGURE: "1"
  TZ: Etc/UTC
  DISPLAY_TZ: Etc/UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  # Git
  GIT_TERMINAL_PROMPT: "0"
  # Docker/BuildKit
  DOCKER_BUILDKIT: "1"
  COMPOSE_DOCKER_CLI_BUILD: "1"

jobs:
  runner-image:
    name: ubuntu-latest - runner-image
    runs-on: ubuntu-latest
    outputs:
      RUNNER_IMAGE: ${{ steps.resolve-runner-image.outputs.RUNNER_IMAGE }}
    steps:
      - name: Resolve runner-image
        id: resolve-runner-image
        uses: Grinch27/github-actions/.github/actions/resolve-runner-image@main

  action:
    name: >-
      ${{ needs.runner-image.outputs.RUNNER_IMAGE }} -
      ${{ (inputs.Use_Container || !inputs.Target_System) && 'Container' || 'Non-container' }}
    needs: runner-image
    runs-on: ${{ needs.runner-image.outputs.RUNNER_IMAGE }}
    container:
      # An empty image selects the host runner.
      image: ${{ (inputs.Use_Container || !inputs.Target_System) && 'ubuntu:devel' || '' }}
      options: >-
        --privileged
        --user=0:0
        --pid=host
        --ipc=host
        --uts=host
        --cgroupns=host
        --cap-add=ALL
        --security-opt apparmor=unconfined
        --security-opt seccomp=unconfined
        --init
        --pids-limit=-1
        --shm-size=12g
        --ulimit nofile=1048576:1048576
      volumes:
        - /dev:/dev
        - /sys:/sys:rw
        - /sys/fs/cgroup:/sys/fs/cgroup:rw
        - /run/udev:/run/udev:ro
        - /lib/modules:/lib/modules:ro
        - /var/run/docker.sock:/var/run/docker.sock
    env:
      custom_env: ${{ inputs.custom_env || '' }}
      # ========= Toolchain Environment Variables ==========
      # ----- gcc -----
      gcc_purge: false
      gcc_install: false
      gcc_switch: false
      gcc_version: ""
      gcc_aarch64: ${{ (inputs.Target_System || 'MediaTek_Ralink_ARM') == 'MediaTek_Ralink_ARM' }}
      # ----- clang -----
      clang_purge: false
      clang_install: false
      clang_switch: false
      clang_version: ""
      # ----- jdk -----
      jdk_purge: false
      jdk_install: false
      jdk_switch: false
      jdk_version: ""
      # ----- docker -----
      docker_install: false
      qemu_install: false
      # ========= Workspace Environment Variables ==========
      # ----- Repository -----
      REPO_target: ${{ inputs.OpenWrt_Repository || 'https://github.com/openwrt/openwrt.git' }}
      REPO_target_branch: ${{ inputs.OpenWrt_Branch || 'main' }}
      REPO_self: "https://github.com/${{ github.repository }}"
      REPO_self_branch: ${{ github.ref_name }}
      REPO_self_sha: ${{ github.sha }}
      REPO_self_owner: ${{ github.repository_owner }}
      # ----- Build Target -----
      Target_System: ${{ inputs.Target_System || 'MediaTek_Ralink_ARM' }}
      Subtarget: ${{ inputs.Subtarget || 'MT798x' }}
      Target_Profile: ${{ inputs.Target_Profile || inputs.Subtarget || 'nokia_ea0326gmp' }}
      # ----- Build Path -----
      PATH_build: "/builder"
      PATH_target: &path_target "/builder/target"
      PATH_output: "/builder/output"
      PATH_self: "/builder/self"
      MD_release: "/builder/release.md"
    defaults:
      run:
        shell: bash
        working-directory: *path_target
    steps:
      # ========== General Environment Setup: Start ==========
      - name: Prepare build environment
        id: docker-workspace
        uses: Grinch27/github-actions/.github/actions/env-indocker@main

      # ========== General Environment Setup: End ==========
      - name: Clone self at triggering commit
        id: clone-self
        working-directory: /
        run: |
          set -euo pipefail
          git init -q "${PATH_self}"
          git -C "${PATH_self}" remote add origin "${REPO_self}"
          GIT_ALLOW_PROTOCOL=https git -C "${PATH_self}" fetch --depth=1 origin "${REPO_self_sha}"
          git -C "${PATH_self}" checkout --detach FETCH_HEAD
          git -C "${PATH_self}" rev-parse HEAD

      - name: Resolve profile paths - ${{ env.Target_System }}/${{ env.Subtarget }}/${{ env.Target_Profile }}
        id: var-setup
        working-directory: /
        env:
          profile_dir: ${{ env.PATH_self }}/${{ env.Target_System }}/${{ env.Subtarget }}/${{ env.Target_Profile }}
          diy_config: ${{ env.Target_Profile }}.config
          diy_feeds: feeds.conf.default
          diy_p1_sh: diy-part1.sh
          diy_p2_sh: diy-part2.sh
          diy_files: files
          PATH_patches: patches
        run: |
          set -euo pipefail
          for component in "${Target_System}" "${Subtarget}" "${Target_Profile}"; do case "${component}" in ''|.|..|*/*|*$'\n'*|*$'\r'*) echo 'Unsafe profile path component' >&2; exit 1 ;; esac; done
          for key in diy_config diy_feeds diy_p1_sh diy_p2_sh diy_files PATH_patches; do
            printf '%s=%s/%s\n' "${key}" "${profile_dir}" "${!key}"
          done >> "${GITHUB_ENV}"

      - name: Clone Target Repository
        id: clone-target
        working-directory: ${{ env.PATH_build }}
        run: |
          set -euo pipefail
          [[ "${REPO_target}" == https://* ]] || { echo 'Repository must use HTTPS' >&2; exit 1; }
          [[ ! -L "${PATH_target}" ]] || { echo 'Unsafe target directory' >&2; exit 1; }
          GIT_ALLOW_PROTOCOL=https git clone --single-branch \
            --branch="${REPO_target_branch}" -- "${REPO_target}" "${PATH_target}"
          printf 'Source commit: %s\n' "$(git -C "${PATH_target}" rev-parse HEAD)"

      # ========== Compile: Start ==========
      - name: (feeds.conf.default) Load custom feeds
        run: |
          echo -e "Current working directory: $(pwd)"
          if [[ -e "${diy_feeds}" && ! "${diy_feeds}" -ef "${PATH_target}/feeds.conf.default" ]]; then
            echo -e "diy_feeds: ${diy_feeds}"
            cp -f -- "${diy_feeds}" "${PATH_target}/feeds.conf.default"
          fi

      - name: (DIY_P1.sh) after load feeds, before update feeds
        env:
          file_script: ${{ env.diy_p1_sh }}
        run: &run-diy |
          if [[ ! -e "${file_script}" && ! -L "${file_script}" ]]; then
            exit 0
          fi
          if [[ ! -f "${file_script}" || ! -r "${file_script}" ]]; then
            printf '::error::DIY script is not a readable file: %s\n' "${file_script}"
            exit 1
          fi
          printf 'Running DIY script: %s\n' "${file_script}"
          bash -e -o pipefail -- "${file_script}"

      - name: Update feeds
        id: feeds-update
        run: |
          echo -e "Current working directory: $(pwd)"
          cat ./feeds.conf.default
          ./scripts/feeds update -a

      - name: (Install) feeds
        id: feeds-install
        run: |
          echo -e "Current working directory: $(pwd)"
          ./scripts/feeds install -a

      - name: (/files) Load custom files
        id: files
        run: |
          mkdir -p -- ./files/etc/config
          if [[ -d "${diy_files}" ]]; then
            cp -a -- "${diy_files}/." ./files/
          elif [[ -e "${diy_files}" || -L "${diy_files}" ]]; then
            printf '::error::Custom files path is not a directory: %s\n' "${diy_files}"
            exit 1
          fi

      - name: (.config) Load custom configuration
        id: config-custom
        run: |
          set -euo pipefail
          if [[ ! "${diy_config}" -ef "${PATH_target}/.config" ]]; then
            cp -f -- "${diy_config}" "${PATH_target}/.config"
          fi

      - name: (patches) Apply patches
        id: patch
        env:
          PATH_patches: ${{ env.PATH_patches }}
        run: |
          printf "Current working directory: %s\n" "$(pwd)"

          if [ -d "${PATH_patches}" ]; then
            find "${PATH_patches}" -type f -name '*.patch' -print0 | sort -z | xargs -0 -r -t -n 1 sh -c 'patch -d ./ -B --merge -p1 --forward < "$1"' _
          fi

      - name: (DIY_P2.sh) after install feeds, before download package
        env:
          file_script: ${{ env.diy_p2_sh }}
        run: *run-diy

      - name: Generate OpenWrt configuration
        id: config-update
        run: |
          set -euo pipefail
          test -s .config
          make defconfig
          test -s .config
          cat .config

      - name: Clean & Rebuild host tools
        id: make-clean
        # if: ${{ 'true' == 'false' }} # disable
        run: |
          make dirclean
          # make tools/install -j$(($(nproc) + 1))
          make tools/install -j$(($(nproc) + 1)) V=s

      - name: Download package
        id: package
        run: |
          echo -e "Current working directory: $(pwd)"
          echo -e "make download: $(($(nproc) + 1)) thread"
          make download -j$(($(nproc) + 1))
          # find dl -size -1024c -exec ls -l {} \;
          # find dl -size -1024c -exec rm -f {} \;

      - name: Test Before Compile
        id: make-test
        if: ${{ 'true' == 'false' }} # disable
        run: |
          echo -e "Current working directory: $(pwd)"
          # grep -R "kmod-sound-mt7620" target/linux/ramips/image -n

      - name: Compile the OpenWrt
        id: compile
        run: |
          echo -e "Current working directory: $(pwd)"
          echo -e "$(($(nproc) + 1)) thread compile"
          # if [ "${{ env.continue_on_error }}" == "true" ]; then
          #   make -j$(($(nproc) + 1)) V=s -k
          # else
          #   make -j$(($(nproc) + 1)) V=s
          # fi
          make -j$(($(nproc) + 1)) V=s

      - name: Stage verified OpenWrt artifacts
        id: output
        run: |
          set -euo pipefail
          # Query OpenWrt for configured, target-specific output directories.
          bin_dir=$(make -s val.BIN_DIR)
          package_dir=$(make -s val.PACKAGE_DIR)
          bin_dir=$(realpath -e -- "${bin_dir}")
          package_dir=$(realpath -e -- "${package_dir}")
          for path in "${bin_dir}" "${package_dir}"; do
            [[ -d "${path}" && "${path}" == "${PATH_build}/"* ]] || {
              printf 'Invalid OpenWrt output path: %s\n' "${path}" >&2
              exit 1
            }
          done

          version=''
          while IFS= read -r -d '' package; do
            filename="${package##*/}"
            [[ "${filename}" =~ ^kernel[-_]([0-9]+\.[0-9]+\.[0-9]+)([-_.~]|$) ]] || {
              printf 'Cannot parse kernel version: %s\n' "${filename}" >&2
              exit 1
            }
            next_version="${BASH_REMATCH[1]}"
            [[ -z "${version}" || "${version}" == "${next_version}" ]] || {
              printf 'Conflicting kernel versions: %s and %s\n' "${version}" "${next_version}" >&2
              exit 1
            }
            version="${next_version}"
          done < <(find "${package_dir}" -type f \( -name 'kernel-*.apk' -o -name 'kernel_*.apk' -o -name 'kernel-*.ipk' -o -name 'kernel_*.ipk' \) -print0)
          [[ -n "${version}" ]] || { echo 'Kernel package not found' >&2; exit 1; }

          artifacts=()
          firmware_count=0
          while IFS= read -r -d '' artifact; do
            [[ -s "${artifact}" ]] || { printf 'Empty artifact: %s\n' "${artifact}" >&2; exit 1; }
            case "${artifact##*/}" in
              *.bin|*.img|*.img.gz|*.itb|*.trx|*.ubi|*.ubifs|*.vmdk|*.qcow2|*.iso|*rootfs.tar.*|*.squashfs|*.ext4|*.elf|*.tar.gz|*.tar.xz|*.tar.zst)
                ((firmware_count += 1)) ;;
            esac
            artifacts+=("${artifact}")
          done < <(find "${bin_dir}" -mindepth 1 -maxdepth 1 -type f -print0)
          (( firmware_count > 0 )) || { echo 'No firmware images in BIN_DIR' >&2; exit 1; }

          [[ ! -L "${PATH_output}" ]] || { echo 'Unsafe output directory' >&2; exit 1; }
          mkdir -p -- "${PATH_output}"
          [[ -z "$(find "${PATH_output}" -mindepth 1 -maxdepth 1 -print -quit)" ]] || {
            echo 'Output directory is not empty' >&2
            exit 1
          }
          cp -f -- "${artifacts[@]}" "${PATH_output}/"
          cp -f -- "${PATH_target}/.config" "${PATH_output}/config"
          {
            printf 'timestamp=%s\n' "$(date +'%y%mw%V')"
            printf 'version=%s\n' "${version}"
          } >> "${GITHUB_OUTPUT}"

      - name: "[release.md] Record release.md"
        id: record
        run: |
          set -euo pipefail
          printf "Current working directory: %s\n" "$(pwd)"

          MD_release_dir=$(dirname -- "${MD_release}")
          mkdir -p -- "${MD_release_dir}"
          if [[ -L "${MD_release}" || ( -e "${MD_release}" && ! -f "${MD_release}" ) ]]; then
            echo 'Release notes path is not a regular file' >&2
            exit 1
          fi
          : > "${MD_release}"

          record_to_markdown() {
            local title="$1"
            local content="$2"
            local code_block="${3:-}"
            local format="\n### %s\n%s\n"

            if [[ -n "${code_block}" ]]; then
              format="\n### %s\n\n<details>\n<summary>%s</summary>\n\n\`\`\`%s\n%s\n\`\`\`\n\n</details>\n"
              printf "${format}" "${title}" "${title}" "${code_block}" "${content}" | tee -a -- "${MD_release}"
            else
              printf "${format}" "${title}" "${content}" | tee -a -- "${MD_release}"
            fi
          }

          # 记录Clone源码的分支和构建者、编译完成时间
          # record_to_markdown "Build ${Target_Profile} - by ${REPO_self_owner}" ""
          # record_to_markdown "OpenWrt branch" "- [${openwrt_branch};${REPO_target_branch}](${REPO_target}/tree/${REPO_target_branch})"
          record_to_markdown "Target" "- [x] ${Target_System} - ${Subtarget} - ${Target_Profile}"
          record_to_markdown "Timestamp" "- [x] $(date +"%Y-%m-%d %H:%M:%S %z")"
          record_to_markdown "Repository" "- [x] ${REPO_target}"
          record_to_markdown "Repository Branch" "- [x] ${REPO_target_branch}"
          record_to_markdown "Configuration Commit" "- [x] ${REPO_self_sha}"
          record_to_markdown "Source Commit" "- [x] $(git rev-parse HEAD)"

          declare -A file_records=(
            ["${diy_feeds}"]="feeds setting|bash"
            ["${diy_p1_sh}"]="$(basename "${diy_p1_sh}")|bash"
            ["${diy_p2_sh}"]="$(basename "${diy_p2_sh}")|bash"
            ["${diy_config}"]="pre-config|makefile"
            ["${PATH_target}/.config"]=".config|makefile"
          )
          for file_path in "${!file_records[@]}"; do
            if [[ -f "${file_path}" ]]; then
              IFS='|' read -r section_title file_type <<< "${file_records[${file_path}]}"
              # 合并grep命令，一次性移除注释和空行
              code_content=$(sed -e '/^[[:space:]]*#/d' -e '/^[[:space:]]*$/d' -e 's/[[:space:]]*$//' "${file_path}")
              record_to_markdown "${section_title}" "${code_content}" "${file_type}"
            fi
          done

          # # 读取profiles.json
          # profiles_json_path="${PATH_output}/profiles.json"
          # profiles_json_content=$(jq '.' "${profiles_json_path}")
          # # record_to_markdown "Profiles" "${profiles_json_content}" "json"

          cat -- "${MD_release}"
      - name: Upload OpenWrt to Release
        id: release
        uses: ncipollo/release-action@main
        env:
          timestamp: ${{ steps.output.outputs.timestamp }}
          version_kernel: ${{ steps.output.outputs.version }}
        with:
          name: "${{ env.REPO_target_branch }}+${{ env.version_kernel }}+${{ env.Target_System }}+${{ env.Subtarget }}+${{ env.Target_Profile }}"
          tag: "${{ env.REPO_target_branch }}+${{ env.version_kernel }}+${{ env.Target_Profile }}"
          artifacts: "${{ env.PATH_output }}/*"
          allowUpdates: true
          removeArtifacts: false
          replacesArtifacts: true
          token: "${{ secrets.GITHUB_TOKEN }}"
          bodyFile: "${{ env.MD_release }}"
