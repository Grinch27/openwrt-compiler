name: Call Build (All in One)

# Github Actions workflow syntax reference:
# https://docs.github.com/zh/actions/reference/workflows-and-actions/workflow-syntax
# https://docs.github.com/zh/actions/reference/workflows-and-actions/metadata-syntax#runs-for-composite-actions
# https://docs.github.com/en/actions/reference/workflows-and-actions/reusing-workflow-configurations#yaml-anchors-and-aliases
# Verify both execution modes on hosted runners, including job placement and /builder.
# Confirm hosted schedule/call inputs, both build environments, and release behavior.
# Direct main pushes build Nokia EA0326GMP and may update its release.
# All targets require their local profile configuration; verify new targets before scheduling.
# Review future runner-resolution reuse separately; retain dynamic runner selection.
# D01-D04: declarative defaults; preserve seven outputs and typed boolean inputs.
# Risk: trusted HTTPS build sources only; shared input-custom validates overrides.
# Verify hosted env outputs, exact config SHA, clean clone paths and defconfig equivalence.
# Unknown: historical forks and indirect DIY dependencies require real build acceptance.
# Variable setup: preserve exported names and paths; verify both execution modes and shared env-indocker.
# Verify direct push, reusable caller, explicit false, invalid inputs and hosted release behavior.

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/call-build_allinone.yml"
      - "MediaTek_Ralink_ARM/MT798x/nokia_ea0326gmp/**"
  workflow_dispatch:
    inputs:
      OpenWrt_Repository:
        description: "repository (full HTTPS URL)"
        type: string
        required: false
        default: "https://git.openwrt.org/openwrt/openwrt.git"
      OpenWrt_Branch:
        description: "Git branch name"
        type: string
        required: false
        default: "main"
      Target_System:
        description: "target system"
        type: choice
        required: false
        default: "x86"
        options:
          - x86
          - MediaTek_Ralink_ARM
          - MediaTek_Ralink_MIPS
      Subtarget:
        description: "subtarget"
        type: choice
        required: false
        default: "x86_64"
        options:
          - x86_64
          - MT798x
          - MT7620
          - MT7621
      Target_Profile:
        description: "local profile (empty means Subtarget)"
        type: string
        required: false
        default: ""
      Use_Container:
        description: "run the build job in a container"
        type: boolean
        required: false
        default: true
      custom_env:
        description: "toolchain key=value;key=value (no secrets)"
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      OpenWrt_Repository:
        type: string
        required: true
      OpenWrt_Branch:
        type: string
        required: true
      Target_System:
        type: string
        required: true
      Subtarget:
        type: string
        required: true
      Target_Profile:
        type: string
        default: ""
      Use_Container:
        type: boolean
        default: true
      custom_env:
        type: string
        default: ""

run-name: >-
  Compile OpenWrt -
  ${{ github.event_name }} -
  ${{ github.ref_name }}

permissions: write-all

defaults:
  run:
    shell: bash

env:
  DEBIAN_FRONTEND: noninteractive
  DEBCONF_NONINTERACTIVE_SEEN: "true"
  APT_LISTCHANGES_FRONTEND: none
  NEEDRESTART_MODE: a
  FORCE_UNSAFE_CONFIGURE: "1"
  TZ: Etc/UTC
  DISPLAY_TZ: Etc/UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  # Git
  GIT_TERMINAL_PROMPT: "0"
  # Docker/BuildKit
  DOCKER_BUILDKIT: "1"
  COMPOSE_DOCKER_CLI_BUILD: "1"

jobs:
  runner-image:
    name: ubuntu-latest - runner-image
    runs-on: ubuntu-latest
    env:
      openwrt_repo: ${{ inputs.OpenWrt_Repository || ((github.event_name == 'push' && github.workflow_ref == format('{0}/.github/workflows/call-build_allinone.yml@refs/heads/main', github.repository)) && 'https://github.com/openwrt/openwrt.git' || 'https://git.openwrt.org/openwrt/openwrt.git') }}
      openwrt_branch: ${{ inputs.OpenWrt_Branch || 'main' }}
      target_system: ${{ inputs.Target_System || ((github.event_name == 'push' && github.workflow_ref == format('{0}/.github/workflows/call-build_allinone.yml@refs/heads/main', github.repository)) && 'MediaTek_Ralink_ARM' || 'x86') }}
      subtarget: ${{ inputs.Subtarget || ((github.event_name == 'push' && github.workflow_ref == format('{0}/.github/workflows/call-build_allinone.yml@refs/heads/main', github.repository)) && 'MT798x' || 'x86_64') }}
      target_profile: ${{ (github.event_name == 'push' && github.workflow_ref == format('{0}/.github/workflows/call-build_allinone.yml@refs/heads/main', github.repository)) && 'nokia_ea0326gmp' || inputs.Target_Profile || inputs.Subtarget || 'x86_64' }}
      use_container: ${{ ((github.event_name == 'push' && github.workflow_ref == format('{0}/.github/workflows/call-build_allinone.yml@refs/heads/main', github.repository)) || inputs.Use_Container) && 'true' || 'false' }}
      custom_env: ${{ inputs.custom_env || '' }}
    outputs:
      RUNNER_IMAGE: ${{ steps.resolve-runner-image.outputs.RUNNER_IMAGE }}
      openwrt_repo: ${{ env.openwrt_repo }}
      openwrt_branch: ${{ env.openwrt_branch }}
      target_system: ${{ env.target_system }}
      subtarget: ${{ env.subtarget }}
      target_profile: ${{ env.target_profile }}
      use_container: ${{ env.use_container }}
      custom_env: ${{ env.custom_env }}
    steps:
      - name: Resolve runner-image
        id: resolve-runner-image
        uses: Grinch27/github-actions/.github/actions/resolve-runner-image@main

  action:
    name: >-
      ${{ needs.runner-image.outputs.RUNNER_IMAGE }} -
      ${{ needs.runner-image.outputs.use_container == 'true' && 'Container' || 'Non-container' }} -
      ${{ needs.runner-image.outputs.openwrt_branch }} -
      ${{ needs.runner-image.outputs.target_system }} -
      ${{ needs.runner-image.outputs.subtarget }} -
      ${{ needs.runner-image.outputs.target_profile }}
    needs: runner-image
    runs-on: ${{ needs.runner-image.outputs.RUNNER_IMAGE }}
    container:
      # An empty image selects the host runner.
      image: ${{ needs.runner-image.outputs.use_container == 'true' && 'ubuntu:devel' || '' }}
      options: >-
        --privileged
        --user=0:0
        --pid=host
        --ipc=host
        --uts=host
        --cgroupns=host
        --cap-add=ALL
        --security-opt apparmor=unconfined
        --security-opt seccomp=unconfined
        --init
        --pids-limit=-1
        --shm-size=12g
        --ulimit nofile=1048576:1048576
      volumes:
        - /dev:/dev
        - /sys:/sys:rw
        - /sys/fs/cgroup:/sys/fs/cgroup:rw
        - /run/udev:/run/udev:ro
        - /lib/modules:/lib/modules:ro
        - /var/run/docker.sock:/var/run/docker.sock
    env:
      custom_env: ${{ needs.runner-image.outputs.custom_env }}
      # ========= Toolchain Environment Variables ==========
      # ----- gcc -----
      gcc_purge: false
      gcc_install: false
      gcc_switch: false
      gcc_version: ""
      gcc_aarch64: ${{ needs.runner-image.outputs.target_system == 'MediaTek_Ralink_ARM' && 'true' || 'false' }}
      # ----- clang -----
      clang_purge: false
      clang_install: false
      clang_switch: false
      clang_version: ""
      # ----- jdk -----
      jdk_purge: false
      jdk_install: false
      jdk_switch: false
      jdk_version: ""
      # ----- docker -----
      docker_install: false
      qemu_install: false
      # ========= Workspace Environment Variables ==========
      # ----- Repository -----
      REPO_target: "${{ needs.runner-image.outputs.openwrt_repo }}"
      REPO_target_branch: "${{ needs.runner-image.outputs.openwrt_branch }}"
      REPO_self: "https://github.com/${{ github.repository }}"
      REPO_self_branch: ${{ github.ref_name }}
      REPO_self_sha: ${{ github.sha }}
      REPO_self_owner: ${{ github.repository_owner }}
      # ----- Build Target -----
      Target_System: ${{ needs.runner-image.outputs.target_system }}
      Subtarget: ${{ needs.runner-image.outputs.subtarget }}
      Target_Profile: ${{ needs.runner-image.outputs.target_profile }}
      # ----- Build Path -----
      PATH_build: "/builder"
      PATH_target: "/builder/target"
      PATH_output: "/builder/output"
      PATH_backup: "/builder/backup"
      PATH_self: "/builder/self"
      MD_release: "/builder/release.md"
      # PATH_patches: "/builder/target/patches"
    steps:
      # ========== Pre: Settings ==========
      - name: Verify build execution mode
        env:
          USE_CONTAINER: ${{ needs.runner-image.outputs.use_container }}
          JOB_CONTAINER_ID: ${{ job.container.id }}
        run: |
          if [[ "$USE_CONTAINER" == true && -n "$JOB_CONTAINER_ID" ]] ||
             [[ "$USE_CONTAINER" == false && -z "$JOB_CONTAINER_ID" ]]; then
            printf 'Build job matches use_container=%s\n' "$USE_CONTAINER"
          else
            printf '::error::Build job placement differs from use_container=%s\n' "$USE_CONTAINER"
            exit 1
          fi

      # ========== General Environment Setup: Start ==========
      - name: Prepare build environment
        id: docker-workspace
        uses: Grinch27/github-actions/.github/actions/env-indocker@main

      # ========== General Environment Setup: End ==========
      - name: Clone self at triggering commit
        id: clone-self
        working-directory: /
        run: |
          set -euo pipefail
          # The disk initializer may create an empty PATH_self; never erase it.
          [[ ! -L "$PATH_self" ]] || { echo 'Unsafe self directory' >&2; exit 1; }
          if [[ -d "$PATH_self" && -n "$(find "$PATH_self" -mindepth 1 -maxdepth 1 -print -quit)" ]]; then
            echo 'Self directory is not empty' >&2
            exit 1
          fi
          git init "$PATH_self"
          git -C "$PATH_self" remote add origin "$REPO_self"
          GIT_ALLOW_PROTOCOL=https git -C "$PATH_self" fetch --depth=1 origin "$REPO_self_sha"
          git -C "$PATH_self" checkout --detach FETCH_HEAD
          [[ "$(git -C "$PATH_self" rev-parse HEAD)" == "$REPO_self_sha" ]]
          git -C "$PATH_self" rev-parse HEAD

      - name: (Var) environment variable setup
        id: var-setup
        working-directory: /
        run: |
          set -euo pipefail
          # Safety only: prevent path traversal and environment-file injection.
          for component in "$Target_System" "$Subtarget" "$Target_Profile"; do
            case "$component" in
              ''|.|..|*/*|*$'\n'*|*$'\r'*) echo 'Unsafe profile path component' >&2; exit 1 ;;
            esac
          done
          profile_dir="${PATH_self}/${Target_System}/${Subtarget}/${Target_Profile}"
          diy_config="${profile_dir}/${Target_Profile}.config"
          diy_feeds="${profile_dir}/feeds.conf.default"
          diy_p1_sh="${profile_dir}/diy-part1.sh"
          diy_p2_sh="${profile_dir}/diy-part2.sh"
          diy_files="${profile_dir}/files"
          PATH_patches="${profile_dir}/patches"
          for key in diy_config diy_feeds diy_p1_sh diy_p2_sh diy_files PATH_patches; do
            resolved=$(realpath -m -- "${!key}")
            [[ "$resolved" == "$PATH_self/"* ]] || { echo 'Profile path escapes self repository' >&2; exit 1; }
          done
          [[ -f "$diy_config" ]] || { echo 'Target profile configuration not found' >&2; exit 1; }
          for key in diy_config diy_feeds diy_p1_sh diy_p2_sh diy_files PATH_patches; do
            printf '%s=%s\n' "$key" "${!key}"
          done >> "$GITHUB_ENV"

      - name: Clone Target Repository
        id: clone-target
        working-directory: ${{ env.PATH_build }}
        run: |
          set -euo pipefail
          # Accept trusted full HTTPS URLs only; disallow local/exec transports.
          [[ "$REPO_target" == https://* ]] || { echo 'Repository must use HTTPS' >&2; exit 1; }
          [[ ! -L "$PATH_target" ]] || { echo 'Unsafe target directory' >&2; exit 1; }
          GIT_ALLOW_PROTOCOL=https git clone --single-branch \
            --branch="$REPO_target_branch" -- "$REPO_target" "$PATH_target"
          git -C "$PATH_target" rev-parse HEAD
          df -hT "$PATH_target"

      # ========== Compile: Start ==========
      - name: (feeds.conf.default) Load custom feeds
        working-directory: ${{ env.PATH_target }}
        run: |
          echo -e "Current working directory: $(pwd)"
          if [[ -e "${diy_feeds}" && ! "${diy_feeds}" -ef "${PATH_target}/feeds.conf.default" ]]; then
            echo -e "diy_feeds: ${diy_feeds}"
            cp -f -- "$diy_feeds" "$PATH_target/feeds.conf.default"
          fi

      - name: (DIY_P1.sh) after load feeds, before update feeds
        working-directory: ${{ env.PATH_target }}
        env:
          file_script: ${{ env.diy_p1_sh }}
        run: |
          echo -e "Current working directory: $(pwd)"
          if [[ -e "${file_script}" ]]; then
            echo -e "file_script: ${file_script}"
            chmod +x -- "$file_script"
            bash -- "$file_script"
            cat -- "$file_script"
          fi

      - name: Update feeds
        id: feeds-update
        working-directory: ${{ env.PATH_target }}
        run: |
          echo -e "Current working directory: $(pwd)"
          cat ./feeds.conf.default
          ./scripts/feeds update -a

      - name: (Install) feeds
        id: feeds-install
        working-directory: ${{ env.PATH_target }}
        run: |
          echo -e "Current working directory: $(pwd)"
          ./scripts/feeds install -a

      - name: (/files) Load custom files
        id: files
        working-directory: ${{ env.PATH_target }}
        run: |
          echo -e "Current working directory: $(pwd)"

          mkdir -p ./files/etc/config
          if [[ -e "${diy_files}" ]]; then
              cp -rf -- "$diy_files"/* ./files/
          fi

      - name: (.config) Load custom configuration
        id: config-custom
        working-directory: ${{ env.PATH_target }}
        run: |
          set -euo pipefail
          if [[ ! "$diy_config" -ef "$PATH_target/.config" ]]; then
            cp -f -- "$diy_config" "$PATH_target/.config"
          fi

      - name: (patches) Apply patches
        id: patch
        if: ${{ 'true' == 'false' }} # disable
        env:
          PATH_patches: ${{ env.PATH_patches }}
        working-directory: ${{ env.PATH_target }}
        run: |
          printf "Current working directory: %s\n" "$(pwd)"

          if [ -d "${PATH_patches}" ]; then
            find "${PATH_patches}" -type f -name '*.patch' -print0 | sort -z | xargs -0 -r -t -n 1 sh -c 'patch -d ./ -B --merge -p1 --forward < "$1"' _
          fi

      - name: (DIY_P2.sh) after install feeds, before download package
        working-directory: ${{ env.PATH_target }}
        env:
          file_script: ${{ env.diy_p2_sh }}
        run: |
          echo -e "Current working directory: $(pwd)"
          if [[ -e "${file_script}" ]]; then
            echo -e "file_script: ${file_script}"
            chmod +x -- "$file_script"
            bash -- "$file_script"
            cat -- "$file_script"
          fi

      - name: Generate OpenWrt configuration
        id: config-update
        working-directory: ${{ env.PATH_target }}
        run: |
          set -euo pipefail
          test -s .config
          make defconfig
          test -s .config
          cat .config

      - name: Verify Nokia single-device configuration
        if: ${{ needs.runner-image.outputs.target_profile == 'nokia_ea0326gmp' }}
        working-directory: ${{ env.PATH_target }}
        run: |
          grep -Fxq 'CONFIG_TARGET_mediatek=y' .config
          grep -Fxq 'CONFIG_TARGET_mediatek_filogic=y' .config
          grep -Fxq 'CONFIG_TARGET_mediatek_filogic_DEVICE_nokia_ea0326gmp=y' .config
          grep -Fxq 'CONFIG_TARGET_PROFILE="DEVICE_nokia_ea0326gmp"' .config
          if grep -Eq '^CONFIG_TARGET_(MULTI_PROFILE|ALL_PROFILES|PER_DEVICE_ROOTFS)=y$' .config; then
            echo 'Unexpected multi-device configuration' >&2
            exit 1
          fi

      - name: Clean & Rebuild host tools
        id: make-clean
        # if: ${{ 'true' == 'false' }} # disable
        working-directory: ${{ env.PATH_target }}
        run: |
          make dirclean
          # make tools/install -j$(($(nproc) + 1))
          make tools/install -j$(($(nproc) + 1)) V=s

      - name: Download package
        id: package
        working-directory: ${{ env.PATH_target }}
        run: |
          echo -e "Current working directory: $(pwd)"
          echo -e "make download: $(($(nproc) + 1)) thread"
          make download -j$(($(nproc) + 1))
          # find dl -size -1024c -exec ls -l {} \;
          # find dl -size -1024c -exec rm -f {} \;

      - name: Test Before Compile
        id: make-test
        if: ${{ 'true' == 'false' }} # disable
        working-directory: ${{ env.PATH_target }}
        run: |
          echo -e "Current working directory: $(pwd)"
          # grep -R "kmod-sound-mt7620" target/linux/ramips/image -n

      - name: Compile the OpenWrt
        id: compile
        working-directory: ${{ env.PATH_target }}
        run: |
          echo -e "Current working directory: $(pwd)"
          echo -e "$(($(nproc) + 1)) thread compile"
          # if [ "${{ env.continue_on_error }}" == "true" ]; then
          #   make -j$(($(nproc) + 1)) V=s -k
          # else
          #   make -j$(($(nproc) + 1)) V=s
          # fi
          make -j$(($(nproc) + 1)) V=s

      - name: Verify Nokia firmware image
        if: ${{ needs.runner-image.outputs.target_profile == 'nokia_ea0326gmp' }}
        working-directory: ${{ env.PATH_target }}
        run: |
          image=$(find bin/targets/mediatek/filogic -maxdepth 1 -type f -name '*nokia_ea0326gmp*sysupgrade.itb' -print -quit)
          if [[ -z "$image" || ! -s "$image" ]]; then
            echo 'Nokia sysupgrade image not found' >&2
            exit 1
          fi
          ls -lh "$image"

      - name: Copy to output
        id: output
        working-directory: /
        env:
          PATH_TARGET: ${{ env.PATH_target }}/bin/targets/*/*/*
        run: |
          echo -e "Current working directory: $(pwd)"

          [[ -e "${PATH_output}" ]] || mkdir -p ${PATH_output}

          echo "复制 ${PATH_TARGET} 到: ${PATH_output}/"
          cp -rf ${PATH_TARGET} ${PATH_output}/
          ls -lhR ${PATH_output}/

          echo "复制 ${PATH_target}/.config 到: ${PATH_output}/config"
          cp -f ${PATH_target}/.config ${PATH_output}/config

          echo -e "timestamp=$(date +"%y%mw%V")" >> "${GITHUB_OUTPUT}"

      - name: Version of the kernel
        id: version-kernel
        working-directory: ${{ env.PATH_output }}
        run: |
          echo -e "Current working directory: $(pwd)"

          # 查找 packages 目录中的 kernel 文件
          Package_Kernel=$(find packages -name 'kernel[-_]*.*pk' | head -n 1)
          echo "Kernel file: ${Package_Kernel}"

          if [ -n "$Package_Kernel" ]; then
            # 提取文件名
            Filename_Kernel=$(basename "${Package_Kernel}")
            echo "Filename: ${Filename_Kernel}"
            
            # 使用正则表达式匹配 'kernel-' 或 'kernel_' 后面的 x.y.z 版本号
            # if [[ "${Filename_Kernel}" =~ kernel[-_](\d+\.\d+\.\d+) ]]; then
            if [[ "${Filename_Kernel}" =~ kernel[-_]([0-9]+\.[0-9]+\.[0-9]+) ]]; then
              Version_Kernel="${BASH_REMATCH[1]}"

              echo "Kernel version: ${Version_Kernel}"
              echo "version=${Version_Kernel}" | tee -a "${GITHUB_OUTPUT}"
            else
              echo "Kernel version pattern not found in filename."
            fi
          else
            echo "No kernel file found."
          fi

      - name: (Clean) output
        id: clean-output
        working-directory: ${{ env.PATH_output }}
        run: |
          echo -e "Current working directory: $(pwd)"

          # handle Dir packages
          ls -lhR ./packages
          rm -rf ./packages

      - name: "[release.md] Record release.md"
        id: record
        working-directory: ${{ env.PATH_target }}
        run: |
          printf "Current working directory: %s\n" "$(pwd)"

          MD_release_dir=$(dirname ${MD_release})
          mkdir -p ${MD_release_dir}
          : > ${MD_release}

          set +e
          record_to_markdown() {
            local title="$1"
            local content="$2"
            local code_block="${3:-}"
            local format="\n### %s\n%s\n"

            if [[ -n "${code_block}" ]]; then
              format="\n### %s\n\n<details>\n<summary>%s</summary>\n\n\`\`\`%s\n%s\n\`\`\`\n\n</details>\n"
              printf "${format}" "${title}" "${title}" "${code_block}" "${content}" | tee -a ${MD_release}
            else
              printf "${format}" "${title}" "${content}" | tee -a ${MD_release}
            fi
          }

          # 记录Clone源码的分支和构建者、编译完成时间
          # record_to_markdown "Build ${Target_Profile} - by ${REPO_self_owner}" ""
          # record_to_markdown "OpenWrt branch" "- [${openwrt_branch};${REPO_target_branch}](${REPO_target}/tree/${REPO_target_branch})"
          record_to_markdown "Target" "- [x] ${Target_System} - ${Subtarget} - ${Target_Profile}"
          record_to_markdown "Timestamp" "- [x] $(date +"%Y-%m-%d %H:%M:%S %z")"
          record_to_markdown "Repository" "- [x] ${REPO_target}"
          record_to_markdown "Repository Branch" "- [x] ${REPO_target_branch}"
          record_to_markdown "Configuration Commit" "- [x] ${REPO_self_sha}"
          record_to_markdown "Source Commit" "- [x] $(git rev-parse HEAD)"

          declare -A file_records=(
            ["${diy_feeds}"]="feeds setting|bash"
            ["${diy_p1_sh}"]="$(basename "${diy_p1_sh}")|bash"
            ["${diy_p2_sh}"]="$(basename "${diy_p2_sh}")|bash"
            ["${diy_config}"]="pre-config|makefile"
            ["${{ env.PATH_target }}/.config"]=".config|makefile"
          )
          for file_path in "${!file_records[@]}"; do
            if [[ -f $file_path ]]; then
              IFS='|' read -r section_title file_type <<< "${file_records[$file_path]}"
              # 合并grep命令，一次性移除注释和空行
              code_content=$(grep -E '^[^#]' "$file_path" | grep -Ev '^\s*$' | sed 's/\s\+$//g')
              record_to_markdown "$section_title" "$code_content" "$file_type"
            fi
          done

          # # 读取profiles.json
          # profiles_json_path="${{ env.PATH_output }}/profiles.json"
          # profiles_json_content=$(jq '.' "$profiles_json_path")
          # # record_to_markdown "Profiles" "$profiles_json_content" "json"

          cat ${MD_release}
          set -e

      - name: Upload OpenWrt to Release
        id: release
        uses: ncipollo/release-action@main
        env:
          timestamp: ${{ steps.output.outputs.timestamp }}
          version_kernel: ${{ steps.version-kernel.outputs.version }}
        with:
          name: "${{ needs.runner-image.outputs.openwrt_branch }}+${{ env.version_kernel }}+${{ env.Target_System }}+${{ env.Subtarget }}+${{ env.Target_Profile }}"
          tag: "${{ needs.runner-image.outputs.openwrt_branch }}+${{ env.version_kernel }}+${{ env.Target_Profile }}"
          artifacts: "${{ env.PATH_output }}/*"
          allowUpdates: true
          removeArtifacts: false
          replacesArtifacts: true
          token: "${{ secrets.GITHUB_TOKEN }}"
          bodyFile: "${{ env.MD_release }}"
