name: Call Build (All in One)

# Github Actions workflow syntax reference:
# https://docs.github.com/zh/actions/reference/workflows-and-actions/workflow-syntax
# https://docs.github.com/zh/actions/reference/workflows-and-actions/metadata-syntax#runs-for-composite-actions
# https://docs.github.com/en/actions/reference/workflows-and-actions/reusing-workflow-configurations#yaml-anchors-and-aliases
# Verify both matrix modes on hosted runners, including job placement and /builder.
# Tier 3 builds the Nokia profile and can update its release.

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/call-build_allinone.yml"
      - "MediaTek_Ralink_ARM/MT798x/nokia_ea0326gmp/**"
  schedule:
    - cron: &cron_everyday "0 21 * * *"
      timezone: "Etc/UTC"
    # Sunday daily slot + 3 hours (Monday 00:00 UTC)
    - cron: &cron_sunday "0 0 * * 1"
      timezone: "Etc/UTC"
  workflow_dispatch:
    inputs:
      OpenWrt_Repository:
        description: "Custom only: repository (HTTPS or host/path)"
        type: string
        required: false
        default: "git.openwrt.org/openwrt/openwrt.git"
      OpenWrt_Branch:
        description: "Custom only: branch"
        type: string
        required: false
        default: "main"
      Target_System:
        description: "Custom only: target system"
        type: choice
        required: false
        default: "x86"
        options:
          - x86
          - MediaTek_Ralink_ARM
          - MediaTek_Ralink_MIPS
      Subtarget:
        description: "Custom only: subtarget"
        type: choice
        required: false
        default: "x86_64"
        options:
          - x86_64
          - MT798x
          - MT7620
          - MT7621
      Target_Profile:
        description: "Custom only: local profile (empty means Subtarget)"
        type: string
        required: false
        default: ""
      Use_Container:
        description: "Custom only: run the build job in a container"
        type: boolean
        required: false
        default: true
      custom_env:
        description: "Custom only: toolchain key=value;key=value (no secrets)"
        type: string
        required: false
        default: ""

run-name: >-
  Compile OpenWrt -
  ${{ github.event_name }} -
  ${{ github.ref_name }}

permissions: write-all

defaults:
  run:
    shell: bash

env:
  cron_everyday: *cron_everyday
  cron_sunday: *cron_sunday
  CONTAINER_IMAGE: ubuntu:devel
  DEBIAN_FRONTEND: noninteractive
  DEBCONF_NONINTERACTIVE_SEEN: "true"
  APT_LISTCHANGES_FRONTEND: none
  NEEDRESTART_MODE: a
  FORCE_UNSAFE_CONFIGURE: "1"
  TZ: Etc/UTC
  DISPLAY_TZ: Etc/UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  # Git
  GIT_TERMINAL_PROMPT: "0"
  # Docker/BuildKit
  DOCKER_BUILDKIT: "1"
  COMPOSE_DOCKER_CLI_BUILD: "1"

jobs:
  runner-image:
    name: ubuntu-latest - runner-image
    runs-on: &step_image ubuntu-latest
    outputs:
      RUNNER_IMAGE: ${{ steps.resolve-runner-image.outputs.RUNNER_IMAGE }}
      CONTAINER_IMAGE: ${{ env.CONTAINER_IMAGE }}
      CONTAINER_CONFIG: ${{ steps.container-config.outputs.CONTAINER_CONFIG }}
    steps:
      - name: Resolve runner-image
        id: resolve-runner-image
        uses: Grinch27/github-actions/.github/actions/resolve-runner-image@main
      - name: Resolve container configuration
        id: container-config
        env:
          CONTAINER_OPTIONS: >-
            --privileged
            --user=0:0
            --pid=host
            --ipc=host
            --uts=host
            --cgroupns=host
            --cap-add=ALL
            --security-opt apparmor=unconfined
            --security-opt seccomp=unconfined
            --init
            --pids-limit=-1
            --shm-size=12g
            --ulimit nofile=1048576:1048576
        run: |
          config=$(jq -cn --arg image "$CONTAINER_IMAGE" --arg options "$CONTAINER_OPTIONS" '
            {
              image: $image,
              options: $options,
              volumes: [
                "/dev:/dev",
                "/sys:/sys:rw",
                "/sys/fs/cgroup:/sys/fs/cgroup:rw",
                "/run/udev:/run/udev:ro",
                "/lib/modules:/lib/modules:ro",
                "/var/run/docker.sock:/var/run/docker.sock"
              ]
            }')
          printf 'CONTAINER_CONFIG=%s\n' "$config" >> "$GITHUB_OUTPUT"

  toolchain:
    name: ${{ needs.runner-image.outputs.RUNNER_IMAGE }} - ${{ needs.runner-image.outputs.CONTAINER_IMAGE }} - toolchain
    needs: runner-image
    runs-on: ${{ needs.runner-image.outputs.RUNNER_IMAGE }}
    container: ${{ fromJSON(needs.runner-image.outputs.CONTAINER_CONFIG) }}
    outputs:
      gcc_version: ${{ steps.resolve-toolchain.outputs.gcc_version }}
      clang_version: ${{ steps.resolve-toolchain.outputs.clang_version }}
      jdk_version: ${{ steps.resolve-toolchain.outputs.jdk_version }}
      custom_env: ${{ steps.resolve-toolchain.outputs.custom_env }}
    steps:
      - name: Resolve toolchain versions
        id: resolve-toolchain
        uses: Grinch27/github-actions/.github/actions/resolve-toolchain-version@main

  heads:
    name: ${{ needs.runner-image.outputs.RUNNER_IMAGE }} - Heads - ${{ matrix.repo_target }}
    needs: runner-image
    runs-on: ${{ needs.runner-image.outputs.RUNNER_IMAGE }}
    outputs:
      repo_branch: ${{ steps.git-heads.outputs.repo_branch }}
      cron_everyday: ${{ env.cron_everyday }}
      cron_sunday: ${{ env.cron_sunday }}
      build_matrix: ${{ steps.build-matrix.outputs.build_matrix }}
    strategy:
      fail-fast: false
      matrix:
        repo_target: ["https://github.com/openwrt/openwrt.git"]
    steps:
      - name: Get the latest openwrt version branch
        id: git-heads
        run: |
          repo_head=$(git ls-remote --heads ${{ matrix.repo_target }} \
            | grep 'refs/heads/openwrt-[0-9]\+\.[0-9]\+$' \
            | sed 's/.*refs\/heads\/openwrt-//' \
            | sort -V \
            | tail -n1)
          echo "repo_branch=openwrt-$repo_head" | tee -a "${GITHUB_OUTPUT}"

      - name: Resolve build tier and matrix
        id: build-matrix
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          STABLE_BRANCH: ${{ steps.git-heads.outputs.repo_branch }}
          CUSTOM_REPO: ${{ inputs.OpenWrt_Repository }}
          CUSTOM_BRANCH: ${{ inputs.OpenWrt_Branch }}
          CUSTOM_SYSTEM: ${{ inputs.Target_System }}
          CUSTOM_SUBTARGET: ${{ inputs.Subtarget }}
          CUSTOM_PROFILE: ${{ inputs.Target_Profile }}
          CUSTOM_USE_CONTAINER: ${{ inputs.Use_Container }}
          CUSTOM_ENV: ${{ inputs.custom_env }}
        run: |
          set -euo pipefail

          # Keep scheduled/push tiers separate from parameterized manual builds.
          # Reject unknown events or cron strings rather than expanding a default matrix.
          case "$GITHUB_EVENT_NAME" in
            schedule)
              case "$EVENT_SCHEDULE" in
                "$cron_everyday") level="Tier 1" ;;
                "$cron_sunday") level="Tier 2" ;;
                *) echo 'Unknown schedule' >&2; exit 1 ;;
              esac
              ;;
            push) level="Tier 3" ;;
            workflow_dispatch) level=Custom ;;
            *) echo 'Unsupported trigger' >&2; exit 1 ;;
          esac

          custom_env=""
          use_container=true
          if [[ "$level" == Custom ]]; then
            use_container=${CUSTOM_USE_CONTAINER:-true}
            case "$use_container" in
              true|false) ;;
              *) echo 'Invalid Use_Container value' >&2; exit 1 ;;
            esac
            [[ "$CUSTOM_REPO" =~ ^(https://)?[A-Za-z0-9.-]+/[A-Za-z0-9._/-]+$ ]] || { echo 'Invalid repository URL' >&2; exit 1; }
            [[ "/${CUSTOM_REPO#https://}/" != *'/../'* && "/${CUSTOM_REPO#https://}/" != *'/./'* ]] || { echo 'Invalid repository path' >&2; exit 1; }
            CUSTOM_REPO="https://${CUSTOM_REPO#https://}"
            [[ "$CUSTOM_BRANCH" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] && git check-ref-format --branch "$CUSTOM_BRANCH" >/dev/null || { echo 'Invalid branch' >&2; exit 1; }
            case "$CUSTOM_SYSTEM/$CUSTOM_SUBTARGET" in
              x86/x86_64|MediaTek_Ralink_ARM/MT798x|MediaTek_Ralink_MIPS/MT7620|MediaTek_Ralink_MIPS/MT7621) ;;
              *) echo 'Invalid target/subtarget combination' >&2; exit 1 ;;
            esac
            [[ -z "$CUSTOM_PROFILE" || "$CUSTOM_PROFILE" =~ ^[A-Za-z0-9][A-Za-z0-9_-]*$ ]] || { echo 'Invalid profile' >&2; exit 1; }
            if [[ -n "$CUSTOM_ENV" ]]; then
              [[ "$CUSTOM_ENV" =~ ^[a-z_]+=[a-z0-9]+(\;[a-z_]+=[a-z0-9]+)*$ ]] || { echo 'Invalid custom_env syntax' >&2; exit 1; }
              declare -A seen=()
              IFS=';' read -r -a assignments <<< "$CUSTOM_ENV"
              for assignment in "${assignments[@]}"; do
                key=${assignment%%=*}
                value=${assignment#*=}
                [[ -z "${seen[$key]+x}" ]] || { echo 'Duplicate custom_env key' >&2; exit 1; }
                seen[$key]=1
                case "$key" in
                  gcc_purge|gcc_install|gcc_switch|clang_purge|clang_install|clang_switch|jdk_purge|jdk_install|jdk_switch|docker_install|qemu_install)
                    [[ "$value" == true || "$value" == false ]] || { echo 'Invalid boolean' >&2; exit 1; } ;;
                  gcc_version|clang_version|jdk_version)
                    [[ "$value" =~ ^[1-9][0-9]{0,2}$ ]] || { echo 'Invalid toolchain version' >&2; exit 1; } ;;
                  *) echo 'Unsupported custom_env key' >&2; exit 1 ;;
                esac
              done
              custom_env="$CUSTOM_ENV"
            fi
          fi

          matrix=$(jq -cen --arg level "$level" --arg stable "$STABLE_BRANCH" \
            --arg repo "$CUSTOM_REPO" --arg branch "$CUSTOM_BRANCH" \
            --arg system "$CUSTOM_SYSTEM" --arg subtarget "$CUSTOM_SUBTARGET" \
            --arg profile "$CUSTOM_PROFILE" --arg custom_env "$custom_env" \
            --argjson use_container "$use_container" '
            def job($repo; $branch; $system; $subtarget; $profile): {
              openwrt_repo: $repo,
              openwrt_branch: $branch,
              use_container: true,
              workflows_inputs: {
                Target_System: $system,
                Subtarget: $subtarget,
                Target_Profile: $profile
              }
            };
            def official($branch; $system; $subtarget; $profile):
              job("https://github.com/openwrt/openwrt.git"; $branch; $system; $subtarget; $profile);
            {
              "Tier 1": [
                official("main"; "MediaTek_Ralink_ARM"; "MT798x"; "")
              ],
              "Tier 2": [
                official("@stable"; "MediaTek_Ralink_ARM"; "MT798x"; ""),
                official("main"; "x86"; "x86_64"; ""),
                official("main"; "MediaTek_Ralink_MIPS"; "MT7621"; "")
              ],
              "Tier 3": [
                official("main"; "MediaTek_Ralink_ARM"; "MT798x"; "nokia_ea0326gmp")
              ]
            }
            | if $level == "Custom" then
                [job($repo; $branch; $system; $subtarget; $profile) + {use_container: $use_container}]
              else .[$level] end
            | if type != "array" or length == 0 then error("Empty or unknown tier") else . end
            | map(
                if .openwrt_branch == "@stable" then
                  if ($stable | test("^openwrt-[0-9]+\\.[0-9]+$")) then .openwrt_branch = $stable
                  else error("Invalid stable branch") end
                else . end
                | . + {build_level: $level, custom_env: $custom_env}
              )')
          printf 'build_matrix=%s\n' "$matrix" | tee -a "$GITHUB_OUTPUT"

  action:
    name: >-
      ${{ needs.runner-image.outputs.RUNNER_IMAGE }} -
      ${{ matrix.use_container && 'Container' || 'Non-container' }} -
      ${{ matrix.openwrt_branch }} -
      ${{ matrix.workflows_inputs.Target_System }} -
      ${{ matrix.workflows_inputs.Subtarget }} -
      ${{ matrix.workflows_inputs.Target_Profile || matrix.workflows_inputs.Subtarget }}
    needs:
      - runner-image
      - toolchain
      - heads
    runs-on: ${{ needs.runner-image.outputs.RUNNER_IMAGE }}
    # The runner treats an empty container expression as host execution.
    container: ${{ matrix.use_container && fromJSON(needs.runner-image.outputs.CONTAINER_CONFIG) || '' }}
    env:
      custom_env: ${{ matrix.custom_env }}
      # ========= Toolchain Environment Variables ==========
      # ----- gcc -----
      gcc_purge: false
      gcc_install: false
      gcc_switch: false
      gcc_version: ""
      gcc_aarch64: false
      # ----- clang -----
      clang_purge: false
      clang_install: false
      clang_switch: false
      clang_version: ""
      # ----- jdk -----
      jdk_purge: false
      jdk_install: false
      jdk_switch: false
      jdk_version: ""
      # ----- docker -----
      docker_install: false
      qemu_install: false
      # ========= Workspace Environment Variables ==========
      # ----- Repository -----
      REPO_target: "${{ matrix.openwrt_repo }}"
      REPO_target_branch: "${{ matrix.openwrt_branch }}"
      REPO_self: "https://github.com/${{ github.repository }}"
      REPO_self_branch: "main"
      # ----- Build Path -----
      PATH_build: "/builder"
      PATH_target: "/builder/target"
      PATH_output: "/builder/output"
      PATH_backup: "/builder/backup"
      PATH_self: "/builder/self"
      MD_release: "/builder/release.md"
      # PATH_patches: "/builder/target/patches"
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include: ${{ fromJSON(needs.heads.outputs.build_matrix) }}
        # Disabled build targets (not included in the level matrix):
          # - {
          #     openwrt_repo: "https://github.com/openwrt/openwrt.git",
          #     openwrt_branch: "main",
          #     workflows_inputs:
          #       {
          #         Target_System: "MediaTek_Ralink_ARM",
          #         Subtarget: "MT798x",
          #         Target_Profile: "MT798x_docker",
          #       },
          #   }
          # - {
          #     openwrt_repo: "https://github.com/hanwckf/immortalwrt-mt798x.git",
          #     openwrt_branch: "openwrt-21.02",
          #     workflows_inputs:
          #       {
          #         Target_System: "MediaTek_Ralink_ARM",
          #         Subtarget: "MT798x",
          #         Target_Profile: "immortalwrt-mt798x_7981",
          #       },
          #   }
          # - {
          #     openwrt_repo: "https://github.com/hanwckf/immortalwrt-mt798x.git",
          #     openwrt_branch: "openwrt-21.02",
          #     workflows_inputs:
          #       {
          #         Target_System: "MediaTek_Ralink_ARM",
          #         Subtarget: "MT798x",
          #         Target_Profile: "immortalwrt-mt798x_7986",
          #       },
          #   }
    steps:
      # ========== Pre: Settings ==========
      - name: Verify build execution mode
        env:
          USE_CONTAINER: ${{ matrix.use_container }}
          JOB_CONTAINER_ID: ${{ job.container.id }}
        run: |
          if [[ "$USE_CONTAINER" == true && -n "$JOB_CONTAINER_ID" ]] ||
             [[ "$USE_CONTAINER" == false && -z "$JOB_CONTAINER_ID" ]]; then
            printf 'Build job matches use_container=%s\n' "$USE_CONTAINER"
          else
            printf '::error::Build job placement differs from use_container=%s\n' "$USE_CONTAINER"
            exit 1
          fi

      - name: (Env) GCC Cross-Compiler
        id: env-gcc_cross
        run: |
          echo -e "Current working directory: $(pwd)"

          if [[ "${{ matrix.workflows_inputs.Target_System }}" == "MediaTek_Ralink_ARM" ]]; then
            echo "gcc_aarch64=true" | tee -a "${GITHUB_ENV}"
          else
            echo "gcc_aarch64=false" | tee -a "${GITHUB_ENV}"
          fi

          echo "gcc_cross: ${{ env.gcc_aarch64 }}"

      - name: (Var) environment variable setup
        id: var-setup
        working-directory: /
        run: |
          echo -e "Current working directory: $(pwd)"

          # ========== Openwrt make menuconfig ==========
          Target_System="${{ matrix.workflows_inputs.Target_System }}"
          Subtarget="${{ matrix.workflows_inputs.Subtarget }}"
          Target_Profile="${{ matrix.workflows_inputs.Target_Profile }}"
          if [[ -z "$Target_Profile" ]]; then
            Target_Profile="$Subtarget"
          fi

          # ========== Set OpenWrt repo branch (sanitize URL) ==========
          _repo_in="${{ matrix.openwrt_repo }}"
          if [[ "${_repo_in}" =~ ^https?:// ]]; then
            REPO_target="${_repo_in}"
          else
            REPO_target="https://${_repo_in}"
          fi
          REPO_self_owner="${{ github.repository_owner }}"

          # ===== Align with indocker workspace (/builder) =====
          DIR_profile="${Target_System}/${Subtarget}/${Target_Profile}"

          # DIY Files
          diy_config="${PATH_self}/${DIR_profile}/${Target_Profile}.config"
          diy_feeds="${PATH_self}/${DIR_profile}/feeds.conf.default"
          diy_p1_sh="${PATH_self}/${DIR_profile}/diy-part1.sh"
          diy_p2_sh="${PATH_self}/${DIR_profile}/diy-part2.sh"
          diy_files="${PATH_self}/${DIR_profile}/files"
          PATH_patches="${PATH_self}/${DIR_profile}/patches"

          # ========== GITHUB_ENV ==========
          env_vars=(
            "REPO_self_owner"
            "Target_System"
            "Subtarget"
            "Target_Profile"
            "diy_config"
            "diy_feeds"
            "diy_p1_sh"
            "diy_p2_sh"
            "diy_files"
            "PATH_patches"
          )
          for var in "${env_vars[@]}"; do
            echo "${var}=${!var}" | tee -a "${GITHUB_ENV}"
          done

      # ========== General Environment Setup: Start ==========
      - name: Prepare build environment
        id: docker-workspace
        uses: Grinch27/github-actions/.github/actions/env-indocker@main

      # ========== General Environment Setup: End ==========
      - name: Clone Target Repository
        id: clone-target
        working-directory: ${{ env.PATH_build }}
        run: |
          echo -e "Current working directory: $(pwd)"

          rm -rf ${PATH_target}
          mkdir -p ${PATH_target}

          # Clone target repository: without --depth=1
          git clone ${REPO_target} ${PATH_target} --single-branch --branch=${REPO_target_branch} 
          echo -e "REPO_target: [ ${REPO_target} ]\nBRANCH: [ ${REPO_target_branch} ]"

          df -hT ${PWD}

      - name: Version of Target Repo
        id: git-rev
        uses: Grinch27/github-actions/.github/actions/git-rev@main
        with:
          path_target: ${{ env.PATH_target }}

      - name: Clone self
        id: clone-self
        working-directory: /
        run: |
          echo -e "Current working directory: $(pwd)"

          rm -rf ${PATH_self}
          mkdir -p ${PATH_self}

          git clone ${REPO_self} ${PATH_self} --single-branch --depth=1 --branch=${REPO_self_branch}
          echo -e "REPO_self: [ ${REPO_self} ]\nBRANCH: [ ${REPO_self_branch} ]"

          df -hT ${PWD}

      - name: Verify Custom profile exists
        if: ${{ matrix.build_level == 'Custom' }}
        run: |
          if [[ ! -f "$diy_config" ]]; then
            echo 'Custom profile configuration not found' >&2
            exit 1
          fi

      # ========== Compile: Start ==========
      - name: (feeds.conf.default) Load custom feeds
        working-directory: ${{ env.PATH_target }}
        run: |
          echo -e "Current working directory: $(pwd)"
          if [[ -e "${diy_feeds}" && ! "${diy_feeds}" -ef "${PATH_target}/feeds.conf.default" ]]; then
            echo -e "diy_feeds: ${diy_feeds}"
            cp -f ${diy_feeds} ${PATH_target}/feeds.conf.default
          fi

      - name: (DIY_P1.sh) after load feeds, before update feeds
        working-directory: ${{ env.PATH_target }}
        env:
          file_script: ${{ env.diy_p1_sh }}
        run: |
          echo -e "Current working directory: $(pwd)"
          if [[ -e "${file_script}" ]]; then
            echo -e "file_script: ${file_script}"
            chmod +x ${file_script}
            bash ${file_script}
            cat ${file_script}
          fi

      - name: Update feeds
        id: feeds-update
        working-directory: ${{ env.PATH_target }}
        run: |
          echo -e "Current working directory: $(pwd)"
          cat ./feeds.conf.default
          ./scripts/feeds update -a

      - name: (Install) feeds
        id: feeds-install
        working-directory: ${{ env.PATH_target }}
        run: |
          echo -e "Current working directory: $(pwd)"
          ./scripts/feeds install -a

      - name: (/files) Load custom files
        id: files
        working-directory: ${{ env.PATH_target }}
        run: |
          echo -e "Current working directory: $(pwd)"

          mkdir -p ./files/etc/config
          if [[ -e "${diy_files}" ]]; then
              cp -rf ${diy_files}/* ./files/
          fi

      - name: (.config) Load custom configuration
        id: config-custom
        working-directory: ${{ env.PATH_target }}
        run: |
          echo -e "Current working directory: $(pwd)"

          if [[ -e "${diy_config}" && ! "${diy_config}" -ef "${PATH_target}/.config" ]]; then
            echo -e "diy_config: ${diy_config}"
            cp -f ${diy_config} ${PATH_target}/.config
          else
            echo ".config file not found"
          fi
          # yes "" |
          set +e
          make oldconfig
          set -e
          cat ./.config

      - name: (patches) Apply patches
        id: patch
        if: ${{ 'true' == 'false' }} # disable
        env:
          PATH_patches: ${{ env.PATH_patches }}
        working-directory: ${{ env.PATH_target }}
        run: |
          printf "Current working directory: %s\n" "$(pwd)"

          if [ -d "${PATH_patches}" ]; then
            find "${PATH_patches}" -type f -name '*.patch' -print0 | sort -z | xargs -I % -t -0 -n 1 sh -c "cat '%' | patch -d './' -B --merge -p1 --forward"
          fi

      - name: (DIY_P2.sh) after install feeds, before download package
        working-directory: ${{ env.PATH_target }}
        env:
          file_script: ${{ env.diy_p2_sh }}
        run: |
          echo -e "Current working directory: $(pwd)"
          if [[ -e "${file_script}" ]]; then
            echo -e "file_script: ${file_script}"
            chmod +x ${file_script}
            bash ${file_script}
            cat ${file_script}
          fi

      - name: (.config) Update config
        id: config-update
        working-directory: ${{ env.PATH_target }}
        run: |
          echo -e "Current working directory: $(pwd)"
          echo "make oldconfig: update .config file..."
          # yes "" | 
          set +e
          make oldconfig
          set -e
          cat ./.config

      - name: Verify Nokia single-device configuration
        if: ${{ matrix.workflows_inputs.Target_Profile == 'nokia_ea0326gmp' }}
        working-directory: ${{ env.PATH_target }}
        run: |
          make defconfig
          grep -Fxq 'CONFIG_TARGET_mediatek=y' .config
          grep -Fxq 'CONFIG_TARGET_mediatek_filogic=y' .config
          grep -Fxq 'CONFIG_TARGET_mediatek_filogic_DEVICE_nokia_ea0326gmp=y' .config
          grep -Fxq 'CONFIG_TARGET_PROFILE="DEVICE_nokia_ea0326gmp"' .config
          if grep -Eq '^CONFIG_TARGET_(MULTI_PROFILE|ALL_PROFILES|PER_DEVICE_ROOTFS)=y$' .config; then
            echo 'Unexpected multi-device configuration' >&2
            exit 1
          fi

      - name: Clean & Rebuild host tools
        id: make-clean
        # if: ${{ 'true' == 'false' }} # disable
        working-directory: ${{ env.PATH_target }}
        run: |
          make dirclean
          # make tools/install -j$(($(nproc) + 1))
          make tools/install -j$(($(nproc) + 1)) V=s

      - name: Download package
        id: package
        working-directory: ${{ env.PATH_target }}
        run: |
          echo -e "Current working directory: $(pwd)"
          echo -e "make download: $(($(nproc) + 1)) thread"
          make download -j$(($(nproc) + 1))
          # find dl -size -1024c -exec ls -l {} \;
          # find dl -size -1024c -exec rm -f {} \;

      - name: Test Before Compile
        id: make-test
        if: ${{ 'true' == 'false' }} # disable
        working-directory: ${{ env.PATH_target }}
        run: |
          echo -e "Current working directory: $(pwd)"
          # grep -R "kmod-sound-mt7620" target/linux/ramips/image -n

      - name: Compile the OpenWrt
        id: compile
        working-directory: ${{ env.PATH_target }}
        run: |
          echo -e "Current working directory: $(pwd)"
          echo -e "$(($(nproc) + 1)) thread compile"
          # if [ "${{ env.continue_on_error }}" == "true" ]; then
          #   make -j$(($(nproc) + 1)) V=s -k
          # else
          #   make -j$(($(nproc) + 1)) V=s
          # fi
          make -j$(($(nproc) + 1)) V=s

      - name: Verify Nokia firmware image
        if: ${{ matrix.workflows_inputs.Target_Profile == 'nokia_ea0326gmp' }}
        working-directory: ${{ env.PATH_target }}
        run: |
          image=$(find bin/targets/mediatek/filogic -maxdepth 1 -type f -name '*nokia_ea0326gmp*sysupgrade.itb' -print -quit)
          if [[ -z "$image" || ! -s "$image" ]]; then
            echo 'Nokia sysupgrade image not found' >&2
            exit 1
          fi
          ls -lh "$image"

      - name: Copy to output
        id: output
        working-directory: /
        env:
          PATH_TARGET: ${{ env.PATH_target }}/bin/targets/*/*/*
        run: |
          echo -e "Current working directory: $(pwd)"

          [[ -e "${PATH_output}" ]] || mkdir -p ${PATH_output}

          echo "复制 ${PATH_TARGET} 到: ${PATH_output}/"
          cp -rf ${PATH_TARGET} ${PATH_output}/
          ls -lhR ${PATH_output}/

          echo "复制 ${PATH_target}/.config 到: ${PATH_output}/config"
          cp -f ${PATH_target}/.config ${PATH_output}/config

          echo -e "timestamp=$(date +"%y%mw%V")" >> "${GITHUB_OUTPUT}"

      - name: Version of the kernel
        id: version-kernel
        working-directory: ${{ env.PATH_output }}
        run: |
          echo -e "Current working directory: $(pwd)"

          # 查找 packages 目录中的 kernel 文件
          Package_Kernel=$(find packages -name 'kernel[-_]*.*pk' | head -n 1)
          echo "Kernel file: ${Package_Kernel}"

          if [ -n "$Package_Kernel" ]; then
            # 提取文件名
            Filename_Kernel=$(basename "${Package_Kernel}")
            echo "Filename: ${Filename_Kernel}"
            
            # 使用正则表达式匹配 'kernel-' 或 'kernel_' 后面的 x.y.z 版本号
            # if [[ "${Filename_Kernel}" =~ kernel[-_](\d+\.\d+\.\d+) ]]; then
            if [[ "${Filename_Kernel}" =~ kernel[-_]([0-9]+\.[0-9]+\.[0-9]+) ]]; then
              Version_Kernel="${BASH_REMATCH[1]}"

              echo "Kernel version: ${Version_Kernel}"
              echo "version=${Version_Kernel}" | tee -a "${GITHUB_OUTPUT}"
            else
              echo "Kernel version pattern not found in filename."
            fi
          else
            echo "No kernel file found."
          fi

      - name: (Clean) output
        id: clean-output
        working-directory: ${{ env.PATH_output }}
        run: |
          echo -e "Current working directory: $(pwd)"

          # handle Dir packages
          ls -lhR ./packages
          rm -rf ./packages

      - name: "[release.md] Record release.md"
        id: record
        working-directory: ${{ env.PATH_target }}
        run: |
          printf "Current working directory: %s\n" "$(pwd)"

          MD_release_dir=$(dirname ${MD_release})
          mkdir -p ${MD_release_dir}
          : > ${MD_release}

          set +e
          record_to_markdown() {
            local title="$1"
            local content="$2"
            local code_block="${3:-}"
            local format="\n### %s\n%s\n"

            if [[ -n "${code_block}" ]]; then
              format="\n### %s\n\n<details>\n<summary>%s</summary>\n\n\`\`\`%s\n%s\n\`\`\`\n\n</details>\n"
              printf "${format}" "${title}" "${title}" "${code_block}" "${content}" | tee -a ${MD_release}
            else
              printf "${format}" "${title}" "${content}" | tee -a ${MD_release}
            fi
          }

          # 记录Clone源码的分支和构建者、编译完成时间
          # record_to_markdown "Build ${Target_Profile} - by ${REPO_self_owner}" ""
          # record_to_markdown "OpenWrt branch" "- [${openwrt_branch};${REPO_target_branch}](${REPO_target}/tree/${REPO_target_branch})"
          record_to_markdown "Target" "- [x] ${Target_System} - ${Subtarget} - ${Target_Profile}"
          record_to_markdown "Timestamp" "- [x] $(date +"%Y-%m-%d %H:%M:%S %z")"
          record_to_markdown "Repository" "- [x] ${REPO_target}"
          record_to_markdown "Repository Branch" "- [x] ${REPO_target_branch}"

          declare -A file_records=(
            ["${diy_feeds}"]="feeds setting|bash"
            ["${diy_p1_sh}"]="$(basename "${diy_p1_sh}")|bash"
            ["${diy_p2_sh}"]="$(basename "${diy_p2_sh}")|bash"
            ["${diy_config}"]="pre-config|makefile"
            ["${{ env.PATH_target }}/.config"]=".config|makefile"
          )
          for file_path in "${!file_records[@]}"; do
            if [[ -f $file_path ]]; then
              IFS='|' read -r section_title file_type <<< "${file_records[$file_path]}"
              # 合并grep命令，一次性移除注释和空行
              code_content=$(grep -E '^[^#]' "$file_path" | grep -Ev '^\s*$' | sed 's/\s\+$//g')
              record_to_markdown "$section_title" "$code_content" "$file_type"
            fi
          done

          # # 读取profiles.json
          # profiles_json_path="${{ env.PATH_output }}/profiles.json"
          # profiles_json_content=$(jq '.' "$profiles_json_path")
          # # record_to_markdown "Profiles" "$profiles_json_content" "json"

          cat ${MD_release}
          set -e

      - name: Upload OpenWrt to Release
        id: release
        uses: ncipollo/release-action@main
        env:
          timestamp: ${{ steps.output.outputs.timestamp }}
          version_kernel: ${{ steps.version-kernel.outputs.version }}
        with:
          name: "${{ matrix.openwrt_branch }}+${{ env.version_kernel }}+${{ env.Target_System }}+${{ env.Subtarget }}+${{ env.Target_Profile }}"
          tag: "${{ matrix.openwrt_branch }}+${{ env.version_kernel }}+${{ env.Target_Profile }}"
          artifacts: "${{ env.PATH_output }}/*"
          allowUpdates: true
          removeArtifacts: false
          replacesArtifacts: true
          token: "${{ secrets.GITHUB_TOKEN }}"
          bodyFile: "${{ env.MD_release }}"
